name: Scheduled Regression Tests

on:
  schedule:
    # Run twice per day at 08:00 and 20:00 UTC.
    - cron: '0 8,20 * * *'
  workflow_dispatch:

jobs:
  regression:
    name: Run regression tests against production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REGRESSION_BASE_URL: ${{ vars.REGRESSION_BASE_URL || 'https://poe2-tools.up.railway.app/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/playwright-test
        with:
          command: test:e2e:regression
